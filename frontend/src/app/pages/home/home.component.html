<section class="hero">
    <div class="hero-left">
      <h1>What book are you looking for?</h1>
      <p>Novels, fairy tales, fantasy and self-development books. Browse the catalog and order online.</p>
      <div class="hero-actions">
        <a class="btn hero-btn-dark" routerLink="/register">Sign up</a>
        <a class="btn btn-secondary hero-btn-light" routerLink="/catalog">Browse catalog</a>
      </div>
    </div>
  
    <div class="hero-right">
        <img class="hero-image" src="/hero.png" alt="Girl reading a book on a stack of books" />
    </div>
  </section>

<!-- Top rated: 4 лучшие книги по оценкам покупателей -->
@if (topRated().length > 0) {
  <section class="home-top">
    <div class="home-top-head">
      <h2>Top rated</h2>
      <a class="book-card-link" routerLink="/top-rated">See full rating →</a>
    </div>
    <div class="tile-grid">
      @for (b of topRated(); track b.product_id; let i = $index) {
        <app-book-tile [book]="b" [rank]="i + 1" />
      }
    </div>
  </section>
}

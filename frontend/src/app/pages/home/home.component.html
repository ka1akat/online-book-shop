<section class="hero">
    <div class="hero-left">
      <h1>{{ language.text('home.title') }}</h1>
      <p>{{ language.text('home.description') }}</p>
      <div class="hero-actions">
        <a class="btn hero-btn-dark" routerLink="/register">{{ language.text('home.signup') }}</a>
        <a class="btn btn-secondary hero-btn-light" routerLink="/catalog">{{ language.text('home.browse') }}</a>
      </div>
    </div>
  
    <div class="hero-right">
        <img class="hero-image" src="/hero.png" [alt]="language.tr('Girl reading a book on a stack of books')" />
    </div>
  </section>

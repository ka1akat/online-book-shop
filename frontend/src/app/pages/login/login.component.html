<section class="auth-page">
    <div class="panel auth-card">
      <h1>{{ language.tr('Welcome back') }}</h1>
      <p class="muted">{{ language.tr('Log in to your account.') }}</p>
  
      <form class="form" (ngSubmit)="submit()">
        <label>
          {{ language.tr('Email') }}
          <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required />
        </label>
        <label>
          {{ language.tr('Password') }}
          <input
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
        </label>
  
        @if (error()) {
          <p class="alert alert-error">{{ language.tr(error()) }}</p>
        }
  
        <button class="btn btn-wide" type="submit" [disabled]="sending()">
          {{ language.tr(sending() ? 'Logging in…' : 'Log in') }}
        </button>
      </form>
  
      <p class="muted small auth-switch">
        {{ language.tr("Don't have an account?") }} <a routerLink="/register">{{ language.tr('Sign up') }}</a>
      </p>
    </div>
  </section>

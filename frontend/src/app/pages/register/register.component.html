<section class="auth-page">
    <div class="panel auth-card">
      @if (user(); as u) {
        <h1>Welcome, {{ u.full_name }}!</h1>
        <p class="muted">Your account for {{ u.email }} has been created.</p>
        <a class="btn" routerLink="/catalog">Browse catalog</a>
      } @else {
        <h1>Create an account</h1>
        <p class="muted">Sign up to start ordering books.</p>
  
        <form class="form" (ngSubmit)="submit()">
          <label>
            Full name
            <input name="full_name" [(ngModel)]="fullName" autocomplete="name" required />
          </label>
          <label>
            Email
            <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              [(ngModel)]="password"
              autocomplete="new-password"
              required
            />
          </label>
  
          @if (error()) {
            <p class="alert alert-error">{{ error() }}</p>
          }
  
          <button class="btn btn-wide" type="submit" [disabled]="sending()">
            {{ sending() ? 'Creating account…' : 'Sign up' }}
          </button>
        </form>
  
        <p class="muted small auth-switch">
          Already have an account? <a routerLink="/login">Log in</a>
        </p>
      }
    </div>
  </section>

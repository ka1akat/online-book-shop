<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark">B</span>
    Online Book Shop
  </a>
  <nav>
    <a routerLink="/catalog" routerLinkActive="active">Catalog</a>
    <a routerLink="/cart" routerLinkActive="active" class="cart-link">
      Cart
      @if (cart.count() > 0) {
        <span class="cart-count">{{ cart.count() }}</span>
      }
    </a>
    @if (auth.user(); as user) {
      <span class="nav-user">{{ user.full_name }}</span>
      <button class="nav-logout" type="button" (click)="auth.logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer muted small">KBTU · Online Shop Team · student project</footer>
